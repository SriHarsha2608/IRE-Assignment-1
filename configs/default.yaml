paths:
  raw_dir: data/raw
  processed_dir: data/processed
  temp_dir: data/tmp

downloads:
  MIND: https://huggingface.co/datasets/yjw1029/MIND/resolve/main
  EB-NeRD: https://ebnerd-dataset.s3.eu-west-1.amazonaws.com

dataset_defaults:
  MIND:
    version: MINDsmall
    archives: [MINDsmall_train.zip, MINDsmall_dev.zip]
  EB-NeRD:
    version: "2024"
    bundles: [demo, small]
    archives:
      demo: ebnerd_demo.zip
      small: ebnerd_small.zip
    embeddings:
      word2vec: artifacts/Ekstra_Bladet_word2vec.zip
      bert: artifacts/google_bert_base_multilingual_cased.zip

temporal_split:
  method: days
  val_days: 2
  test_days: 2
  fallback_ratios: [0.8, 0.1, 0.1]

history:
  size: 50

retrieval:
  bm25:
    top_k: [50, 100, 200]
    field: title_abstract   # corpus field: title | abstract | title_abstract
    query_field: title      # query field: title | title_abstract
    history_query_cap: 20   # most-recent clicks concatenated into the query
    k1: 1.5
    b: 0.75
    remove_stopwords: true
  semantic:
    top_k: [50, 100, 200]
    embedding: word2vec   # EB-NeRD: word2vec | bert (MIND always uses entity_mean)
    normalize: true       # L2-normalize before ANN (cosine similarity)

evaluation:
  metrics: [auc, mrr, ndcg@5, ndcg@10]
  beyond_accuracy: [intra_list_diversity, novelty, coverage]
  slices: [cold_start_vs_warm]
  bootstrap_runs: 1000
  bootstrap_seed: 42