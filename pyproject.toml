[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ire-rec"
version = "0.1.0"
description = "CS4.406 IRE Assignment 1 - lexical & semantic retrieval pipeline on MIND and EB-NeRD"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "polars>=0.20",
    "scikit-learn>=1.3",
    "rank-bm25>=0.2.2",
    "nltk>=3.8",
    "faiss-cpu>=1.7.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7", "jupyter>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]