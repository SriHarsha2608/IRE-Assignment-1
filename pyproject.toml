[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ire-rec"
version = "0.1.0"
description = "CS4.406 IRE Assignment 1 - lexical & semantic retrieval pipeline on MIND and EB-NeRD"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]